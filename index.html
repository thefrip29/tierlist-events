<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tier list des events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121216; --panel:#1b1b22; --line:#2a2a33; --text:#f2f2f5; --muted:#8c8c99;
    --chip:#2b2b36; --chip-hover:#363644; --accent:#ffdf7f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
  body{padding:24px 16px 40px;max-width:1000px;margin:0 auto}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-family:"Archivo Black",sans-serif;font-size:clamp(24px,5vw,36px);margin:0;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  button{font:600 13px Inter,sans-serif;background:var(--chip);color:var(--text);border:1px solid var(--line);
    padding:9px 14px;border-radius:8px;cursor:pointer}
  button:hover{background:var(--chip-hover)}
  button.primary{background:var(--accent);color:#141414;border-color:var(--accent);font-weight:700}
  button.primary:hover{filter:brightness(1.07)}
  button:disabled{opacity:.5;cursor:default}
  .board{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .row{display:flex;min-height:78px;border-bottom:1px solid var(--line);background:var(--panel)}
  .row:last-child{border-bottom:none}
  .label{flex:0 0 120px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:"Archivo Black",sans-serif;font-size:16px;color:#141414;padding:8px;line-height:1.15}
  .zone{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px;min-height:78px;transition:background .12s}
  .zone.over{background:#262632}
  .pool-wrap{margin-top:22px}
  .pool-title{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 8px}
  #pool{border:1px dashed var(--line);border-radius:10px;min-height:90px}
  .chip{user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;
    background:var(--chip);border:1px solid #3a3a48;border-radius:8px;padding:10px 14px;
    font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 1px 0 rgba(0,0,0,.3)}
  .chip:hover{background:var(--chip-hover)}
  .chip.ghost{opacity:.3}
  .drag{position:fixed;pointer-events:none;z-index:999;cursor:grabbing;transform:rotate(-2deg) scale(1.06);
    box-shadow:0 10px 24px rgba(0,0,0,.5)}
  .marker{width:4px;align-self:stretch;min-height:38px;background:#fff;border-radius:2px}
  .submit{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .submit input{flex:1 1 200px;font:500 15px Inter,sans-serif;background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
  .submit input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .submit button{padding:11px 18px;font-size:14px}
  .status{flex-basis:100%;font-size:13px;color:var(--muted);margin:0}
  .status.ok{color:#bfff7f}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;
    padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:1000}
  .toast.show{opacity:1}
  @media (max-width:560px){ .label{flex-basis:84px;font-size:13px} .chip{padding:8px 11px;font-size:13px} }
</style>
</head>
<body>
<header>
  <div>
    <h1>TIER LIST DES EVENTS</h1>
    <div class="sub">Glisse chaque event dans son tier, puis valide ta tier list en bas.</div>
  </div>
  <div class="actions">
    <button id="copy">Copier en texte</button>
    <button id="reset">Réinitialiser</button>
  </div>
</header>

<div class="board" id="board"></div>

<div class="pool-wrap">
  <p class="pool-title">Events à classer</p>
  <div class="zone" id="pool" data-tier="pool"></div>
</div>

<form class="submit" id="form">
  <input id="pseudo" maxlength="40" placeholder="Ton pseudo / bucque" autocomplete="nickname" required>
  <button type="submit" class="primary" id="send">Valider ma tier list</button>
  <p class="status" id="status"></p>
</form>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const KEY = "tierlist-events-v1";
const ID_KEY = "tierlist-events-client-id";
const SENT_KEY = "tierlist-events-sent";

const board = document.getElementById("board");
const pool = document.getElementById("pool");
const zones = {pool};

function store(k,v){ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }
function read(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

TIERS.forEach(t=>{
  const row = document.createElement("div"); row.className="row";
  const lab = document.createElement("div"); lab.className="label"; lab.style.background=t.color; lab.textContent=t.name;
  const z = document.createElement("div"); z.className="zone"; z.dataset.tier=t.id;
  row.append(lab,z); board.append(row); zones[t.id]=z;
});

function makeChip(name){
  const c=document.createElement("div"); c.className="chip"; c.textContent=name; c.dataset.name=name;
  c.addEventListener("pointerdown", startDrag); return c;
}

function load(){
  let state=null;
  try{ state=JSON.parse(read(KEY)); }catch(e){}
  Object.values(zones).forEach(z=>z.innerHTML="");
  const placed=new Set();
  if(state){
    for(const [tier,names] of Object.entries(state)){
      if(!zones[tier]) continue;
      names.forEach(n=>{ if(EVENTS.includes(n)&&!placed.has(n)){ zones[tier].append(makeChip(n)); placed.add(n);} });
    }
  }
  EVENTS.forEach(n=>{ if(!placed.has(n)) pool.append(makeChip(n)); });
}
function current(){
  const s={}; for(const [k,z] of Object.entries(zones)) s[k]=[...z.querySelectorAll(".chip")].map(c=>c.dataset.name);
  return s;
}
function save(){ store(KEY, JSON.stringify(current())); }

/* ---- drag & drop (souris + tactile) ---- */
let drag=null;
const marker=document.createElement("div"); marker.className="marker";

function startDrag(e){
  if(e.button!==undefined && e.button!==0) return;
  e.preventDefault();
  const src=e.currentTarget, r=src.getBoundingClientRect();
  const clone=src.cloneNode(true); clone.classList.add("drag");
  clone.style.width=r.width+"px"; clone.style.left=r.left+"px"; clone.style.top=r.top+"px";
  document.body.append(clone); src.classList.add("ghost");
  drag={src,clone,dx:e.clientX-r.left,dy:e.clientY-r.top};
  window.addEventListener("pointermove",onMove);
  window.addEventListener("pointerup",endDrag);
  window.addEventListener("pointercancel",endDrag);
  onMove(e);
}
function zoneAt(x,y){
  const el=document.elementFromPoint(x,y); return el?el.closest(".zone"):null;
}
function onMove(e){
  if(!drag) return;
  drag.clone.style.left=(e.clientX-drag.dx)+"px"; drag.clone.style.top=(e.clientY-drag.dy)+"px";
  document.querySelectorAll(".zone.over").forEach(z=>z.classList.remove("over"));
  const z=zoneAt(e.clientX,e.clientY);
  if(!z){ marker.remove(); return; }
  z.classList.add("over");
  const chips=[...z.querySelectorAll(".chip:not(.ghost)")];
  let before=null;
  for(const c of chips){
    const r=c.getBoundingClientRect();
    if(e.clientY < r.top) { before=c; break; }
    if(e.clientY <= r.bottom && e.clientX < r.left + r.width/2){ before=c; break; }
  }
  z.insertBefore(marker,before);
  const m=60; if(e.clientY<m) window.scrollBy(0,-12); else if(e.clientY>innerHeight-m) window.scrollBy(0,12);
}
function endDrag(){
  if(!drag) return;
  if(marker.parentNode) marker.parentNode.insertBefore(drag.src,marker);
  marker.remove(); drag.clone.remove(); drag.src.classList.remove("ghost");
  document.querySelectorAll(".zone.over").forEach(z=>z.classList.remove("over"));
  window.removeEventListener("pointermove",onMove);
  window.removeEventListener("pointerup",endDrag);
  window.removeEventListener("pointercancel",endDrag);
  drag=null; save();
}

/* ---- boutons ---- */
const toast=document.getElementById("toast");
let toastTimer;
function showToast(t){ toast.textContent=t; toast.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove("show"),1800); }

document.getElementById("reset").onclick=()=>{
  store(KEY,null); load(); showToast("Tier list remise à zéro");
};
document.getElementById("copy").onclick=async()=>{
  const lines=TIERS.map(t=>{
    const n=[...zones[t.id].querySelectorAll(".chip")].map(c=>c.dataset.name);
    return `${t.name} : ${n.length?n.join(", "):"—"}`;
  });
  const rest=[...pool.querySelectorAll(".chip")].map(c=>c.dataset.name);
  if(rest.length) lines.push(`Pas classés : ${rest.join(", ")}`);
  try{ await navigator.clipboard.writeText(lines.join("\n")); showToast("Copié !"); }
  catch(e){ showToast("Copie impossible ici"); }
};

/* ---- validation ---- */
const form=document.getElementById("form"), pseudoIn=document.getElementById("pseudo"),
      sendBtn=document.getElementById("send"), statusEl=document.getElementById("status");

function clientId(){
  let id=read(ID_KEY);
  if(!id){ id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)); store(ID_KEY,id); }
  return id;
}
function showSent(){
  const sent=read(SENT_KEY);
  if(sent){ statusEl.textContent=`Tier list envoyée le ${new Date(+sent).toLocaleString("fr-FR")}. Tu peux la modifier et la renvoyer, ça remplacera l'ancienne.`; statusEl.className="status ok"; sendBtn.textContent="Renvoyer ma tier list"; }
}
pseudoIn.value=read("tierlist-events-pseudo")||"";
showSent();

form.addEventListener("submit", async e=>{
  e.preventDefault();
  const pseudo=pseudoIn.value.trim();
  if(!pseudo){ pseudoIn.focus(); return; }
  const tiers=current(); const rest=tiers.pool; delete tiers.pool;
  if(rest.length && !confirm(`${rest.length} event(s) pas encore classé(s) (${rest.join(", ")}). Envoyer quand même ?`)) return;
  if(!API_URL){ showToast("Le formulaire n'est pas encore branché"); return; }
  sendBtn.disabled=true; statusEl.className="status"; statusEl.textContent="Envoi en cours…";
  try{
    const res=await fetch(API_URL,{method:"POST",body:JSON.stringify({id:clientId(),pseudo,tiers})});
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||"erreur");
    store("tierlist-events-pseudo",pseudo); store(SENT_KEY,String(Date.now()));
    showSent(); showToast("Tier list validée !");
  }catch(err){
    statusEl.className="status"; statusEl.textContent="L'envoi a échoué, réessaie dans un instant.";
  }finally{ sendBtn.disabled=false; }
});

load();
</script>
</body>
</html>
